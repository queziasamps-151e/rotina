<script>
(function () {
  window.__PWA = true;
  function chamar(fn, args) {
    var url = window.RC_API || '';
    if (!/^https:\/\/script\.google\.com\//.test(url)) return Promise.reject(new Error('Endereço do Apps Script não configurado (config.js)'));
    return fetch(url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        try { return JSON.parse(t); }
        catch (e) { throw new Error("Resposta inesperada do servidor (implantação desatualizada ou sem acesso 'Qualquer pessoa')"); }
      });
  }
  function runner(ok, err) {
    var o = {
      withSuccessHandler: function (f) { return runner(f, err); },
      withFailureHandler: function (f) { return runner(ok, f); }
    };
    ['api', 'info', 'poll'].forEach(function (fn) {
      o[fn] = function () {
        var a = Array.prototype.slice.call(arguments);
        chamar(fn, a).then(function (r) { if (ok) ok(r); }, function (e) { if (err) err(e); });
      };
    });
    return o;
  }
  window.google = { script: { run: runner(null, null) } };
})();
</script>

var fotosBusy = false;
function carregarFotos() {
  var pf = S.estado && S.estado.perfis; if (!pf) return;
  var falta = false;
  PESS.forEach(function (p) {
    var x = pf[p]; if (!x || x.tipo !== 'foto') return;
    if (S.fotos[p] && S.fotos[p].v === x.v) return;
    var loc = null; try { loc = JSON.parse(store('rc_foto_' + p) || 'null'); } catch (e) {}
    if (loc && loc.v === x.v && b64ok(loc.b64)) { S.fotos[p] = { v: x.v, src: 'data:image/jpeg;base64,' + loc.b64 }; return; }
    if (Date.now() - (S.fotoTent[p] || 0) < 60000) return;
    S.fotoTent[p] = Date.now(); falta = true;
  });
  if (!falta || fotosBusy) return;
  fotosBusy = true;
  call('perfilFotos').then(function (r) {
    fotosBusy = false; var d = (r && r.dados) || {};
    PESS.forEach(function (p) {
      var x = pf[p];
      if (x && x.tipo === 'foto' && b64ok(d[p])) { S.fotos[p] = { v: x.v, src: 'data:image/jpeg;base64,' + d[p] }; store('rc_foto_' + p, JSON.stringify({ v: x.v, b64: d[p] })); }
    });
    render();
  }).catch(function () { fotosBusy = false; });
}
function reduzirQuadrado(file, lado, cb) {
  var img = new Image(), url = URL.createObjectURL(file);
  img.onload = function () {
    var m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2, c = document.createElement('canvas');
    c.width = lado; c.height = lado; c.getContext('2d').drawImage(img, sx, sy, m, m, 0, 0, lado, lado);
    URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg', 0.78).split(',')[1]);
  };
  img.onerror = function () { S.aviso = 'Não consegui ler a foto.'; render(true); };
  img.src = url;
}

/* ---------- som (sirene, toque, bip) ---------- */
var AC = null, somT = null;
function audio() {
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC && AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; }
  return AC;
}
function tom(f, ms, vol, tipo) {
  var a = audio(); if (!a) return;
  try {
    var o = a.createOscillator(), g = a.createGain();
    o.type = tipo || 'square'; o.frequency.value = f; g.gain.value = vol || 0.25;
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + ms / 1000);
  } catch (e) {}
}
function vibra(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function somParar() { if (somT) clearInterval(somT); somT = null; }
function somIniciar(tipo) {
  somParar();
  var alt = false;
  if (tipo === 'sirene') { var s = function () { tom(alt ? 640 : 980, 380, 0.35); alt = !alt; vibra([300, 100, 300]); }; s(); somT = setInterval(s, 400); }
  else if (tipo === 'toque') { var t = function () { tom(880, 180, 0.2, 'sine'); setTimeout(function () { tom(880, 180, 0.2, 'sine'); }, 260); vibra([200, 100, 200]); }; t(); somT = setInterval(t, 1800); }
  else if (tipo === 'bip') { var b = 0, f = function () { tom(1200, 140, 0.2, 'sine'); vibra(150); if (++b >= 6) somParar(); }; f(); somT = setInterval(f, 500); }
}
function ajustarSom() {
  var k = S.overlayKey || '';
  if (k === S.somKey) return;
  S.somKey = k;
  if (/^sos:/.test(k)) somIniciar('sirene'); else if (/^ch:/.test(k)) somIniciar('toque'); else if (/^alm:/.test(k)) somIniciar('bip'); else somParar();
}

/* ---------- localização ---------- */
function guardaLoc(pos) { S.loc = { lat: pos.coords.latitude, lng: pos.coords.longitude, prec: Math.round(pos.coords.accuracy || 0), t: Date.now() }; S.locStatus = 'ok'; }
function aquecerLoc() {
  if (!navigator.geolocation) { S.locStatus = 'indisponivel'; return; }
  try {
    navigator.geolocation.getCurrentPosition(guardaLoc, function (er) { S.locStatus = er && er.code === 1 ? 'negada' : 'indisponivel'; if (S.aba === 'casa') render(); },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  } catch (e) { S.locStatus = 'indisponivel'; }
}
function esperarLoc(ms) {
  return new Promise(function (res) {
    if (S.loc && Date.now() - S.loc.t < 120000) { res(S.loc); return; }
    if (!navigator.geolocation) { res(null); return; }
    var feito = false, t = setTimeout(function () { if (!feito) { feito = true; res(null); } }, ms);
    try {
      navigator.geolocation.getCurrentPosition(function (pos) { guardaLoc(pos); if (!feito) { feito = true; clearTimeout(t); res(S.loc); } },
        function (er) { S.locStatus = er && er.code === 1 ? 'negada' : 'indisponivel'; if (!feito) { feito = true; clearTimeout(t); res(null); } },
        { enableHighAccuracy: true, timeout: ms, maximumAge: 60000 });
    } catch (e) { clearTimeout(t); res(null); }
  });
}

function iniciarSOS() {
  if (S.sos && S.sos.fase === 'ok' && S.sos.status !== 'engano') { S.modal = 'sos'; render(true); return; }
  S.sos = { cid: 's' + Date.now().toString(36).slice(-9), fase: 'enviando', canais: '', erro: '', tent: 0, foto: null, detOk: false, semLoc: false, status: 'aberto' };
  S.modal = 'sos'; render(true); enviarSOS();
}
function enviarSOS() {
  var s = S.sos; if (!s) return;
  s.fase = 'enviando'; s.tent++;
  esperarLoc(s.tent === 1 ? 2500 : 600).then(function (loc) {
    var p = { cid: s.cid }; if (loc) { p.lat = loc.lat; p.lng = loc.lng; p.prec = loc.prec; }
    s.semLoc = !loc;
    return call('sos', p);
  }).then(function (r) {
    aplicar(r); s.fase = 'ok'; s.id = s.cid; s.canais = (r.extra && r.extra.canais) || '';
    render(true); if (s.semLoc) locTardia(s);
  }).catch(function (e) {
    s.fase = 'erro'; s.erro = e.message;
    if (e.rede && s.tent < 12) setTimeout(function () { if (S.sos === s && s.fase === 'erro') enviarSOS(); }, 5000);
    render(true);
  });
}
function locTardia(s) {
  if (!navigator.geolocation) return;

    navigator.geolocation.getCurrentPosition(function (pos) {
      guardaLoc(pos); s.semLoc = false;
      call('sosAtualiza', { id: s.id, lat: S.loc.lat, lng: S.loc.lng, prec: S.loc.prec }).then(function (r) { aplicar(r); render(); }).catch(function () {});
    }, function () {}, { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 });

}

function scriptWidget(w) {
  var L = [
    '// Rotina da Casa: widget para o app Scriptable (iPhone)',

    'async function dados() {',
    '  try { const r = new Request(BASE + "?w=" + PESSOA + "&t=" + TOKEN); r.timeoutInterval = 20; return await r.loadJSON(); } catch (e) { return null; }',
    '}',
    'function cor(c) { return c === "verde" ? new Color("#43e0b4") : c === "amarelo" ? new Color("#ffd25e") : c === "vermelho" ? new Color("#ff8d9d") : new Color("#cfcfcf"); }',
    'const d = await dados();',
    'const w = new ListWidget();',
    'const g = new LinearGradient();',
    'const alerta = d && d.ok && d.sos && d.sos.length;',
    'g.colors = alerta ? [new Color("#b00020"), new Color("#ff1744")] : [new Color("#5b3fd0"), new Color("#d0408a")];',
    'g.locations = [0, 1];',
    'w.backgroundGradient = g;',
    'w.url = APP;',
    'w.refreshAfterDate = new Date(Date.now() + 15 * 60 * 1000);',
    'function t(txt, size, bold, color) { const x = w.addText(String(txt)); x.font = bold ? Font.boldSystemFont(size) : Font.systemFont(size); x.textColor = color || Color.white(); x.lineLimit = 1; return x; }',
    'if (!d || !d.ok) {',
    '  t("Rotina da Casa", 14, true);',
    '  t("Sem conexão ou token inválido", 11, false);',
    '} else {',
    '  t("Rotina da Casa · " + d.agora, 11, false, new Color("#ffffffcc"));',
    '  if (alerta) t("🚨 " + d.sos[0], 13, true);',
    '  if (PESSOA === "Q") {',
    '    (d.filhas || []).forEach(function (f) { t("● " + f.nome + "  " + (f.pct === null ? "–" : f.pct + "%") + (f.pendentes ? "  (" + f.pendentes + " pend.)" : ""), 14, true, cor(f.cor)); });',
    '    (d.alertas || []).slice(0, 2).forEach(function (a) { t("⚠️ " + a, 11, false); });',
    '    if (d.compras) t("🛒 " + d.compras + " na lista de compras", 11, false);',
    '  } else {',
    '    t((d.pct === null ? "–" : d.pct + "%") + "  ·  " + d.feitas + "/" + d.total + " feitas", 18, true);',
    '    t("🔥 " + d.streak + " dia(s) seguidos", 11, false);',
    '    (d.alertas || []).forEach(function (a) { t("🎥 " + a, 12, true); });',
    '    (d.proximas || []).slice(0, 3).forEach(function (x) { t(x.hora + "  " + x.nome, 12, false); });',
    '    (d.agenda || []).slice(0, 1).forEach(function (x) { t("📅 " + x.hora + "  " + x.nome, 12, true); });',
    '  }',
    '}',
    'if (config.runsInWidget) { Script.setWidget(w); } else { await w.presentMedium(); }',

  ];

}
